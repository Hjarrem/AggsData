<!-- ═══════════════════════════════════════════════════════════════════════
  PATCH 1 of 4 — <head> additions
  FIND: the closing </head> tag in your index.html
  ADD: the following lines BEFORE </head>
════════════════════════════════════════════════════════════════════════════ -->

  <!-- Market Intel Mode styles -->
  <link rel="stylesheet" href="delivery-mode.css">

  <!-- DM Sans — matches the industrial-clean aesthetic already in AggsData -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">


<!-- ═══════════════════════════════════════════════════════════════════════
  PATCH 2 of 4 — Mode Toggle Bar
  FIND: the opening <div id="map"> (or whatever your map container div is)
  ADD: the following block IMMEDIATELY BEFORE that div
════════════════════════════════════════════════════════════════════════════ -->

  <!-- ── Mode Toggle ──────────────────────────────────────────────────── -->
  <div class="mode-toggle-bar" id="mode-toggle-bar" role="group" aria-label="Map mode selector">

    <!-- Producers Mode (existing map) -->
    <button class="mode-btn active" id="mode-btn-producers" aria-pressed="true" title="Aggregate Producer Locations">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 22 22 2 22"/>
      </svg>
      Producers
    </button>

    <div class="mode-divider" aria-hidden="true"></div>

    <!-- Market Intel Mode (new) -->
    <button class="mode-btn intel-btn" id="mode-btn-intel" aria-pressed="false" title="Market Intel — Deliveries & Pricing">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      Market Intel
    </button>

  </div>
  <!-- ── End Mode Toggle ─────────────────────────────────────────────── -->


<!-- ═══════════════════════════════════════════════════════════════════════
  PATCH 3 of 4 — Intel Legend Placeholder
  FIND: wherever your existing map legend is declared in the HTML
        (typically a <div class="legend"> or similar inside / beside #map)
  ADD: the following block alongside it.
  It will only be visible when Market Intel mode is active.
════════════════════════════════════════════════════════════════════════════ -->

  <!-- Market Intel Legend (hidden by default, shown via JS) -->
  <div class="intel-legend" id="intel-legend" style="display:none; position:absolute; bottom:32px; right:12px; z-index:900;">
    <div class="intel-legend-title">Market Intel</div>

    <!-- Delivery order dot colors by product type -->
    <div class="intel-legend-row">
      <div class="legend-dot" style="background:#e8a44a; border-color:#e8a44a;"></div>
      Limestone / Calcite
    </div>
    <div class="intel-legend-row">
      <div class="legend-dot" style="background:#7a6fa0; border-color:#7a6fa0;"></div>
      Granite / Hard Rock
    </div>
    <div class="intel-legend-row">
      <div class="legend-dot" style="background:#6baa75; border-color:#6baa75;"></div>
      Sand &amp; Gravel
    </div>
    <div class="intel-legend-row">
      <div class="legend-dot" style="background:#5b9cba; border-color:#5b9cba;"></div>
      Recycled (RCA/RAP)
    </div>
    <div class="intel-legend-row">
      <div class="legend-dot" style="background:#c26060; border-color:#c26060;"></div>
      Basalt / Quartzite
    </div>

    <div style="height:8px; border-top:1px solid rgba(255,255,255,0.07); margin:8px 0;"></div>

    <!-- Plant symbols -->
    <div class="intel-legend-row">
      <span style="color:#2a7fc1; font-size:11px;">▲</span>
      Own Plant
    </div>
    <div class="intel-legend-row">
      <span style="color:#e05555; font-size:11px;">▲</span>
      Competitor Plant
    </div>

    <div style="margin-top:10px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.07); font-size:10px; color:rgba(255,255,255,0.3); line-height:1.6;">
      Click anywhere on the map<br>to estimate delivered price
    </div>
  </div>


<!-- ═══════════════════════════════════════════════════════════════════════
  PATCH 4 of 4 — Scripts
  FIND: the closing </body> tag in your index.html
  ADD: the following block BEFORE </body>
  (delivery-mode.js must load AFTER Leaflet and your existing map.js)
════════════════════════════════════════════════════════════════════════════ -->

  <!-- Market Intel Mode module -->
  <script src="delivery-mode.js"></script>

  <script>
  // ── Mode Toggle Controller ────────────────────────────────────────────────
  // Assumes your existing Leaflet map instance is available as `window.map`
  // (or whatever global you use — adjust MAP_GLOBAL_NAME below).
  //
  // If your map is not on window, wrap this in whatever init callback
  // fires after your map is ready (e.g. after your DOMContentLoaded block).

  (function initModeToggle() {

    const MAP_GLOBAL_NAME = 'map';   // ← change this if your Leaflet map
                                      //   is stored on a different global

    const btnProducers = document.getElementById('mode-btn-producers');
    const btnIntel     = document.getElementById('mode-btn-intel');
    const intelLegend  = document.getElementById('intel-legend');

    // Elements that belong exclusively to the Producers mode.
    // Add selector strings for any controls, legends, or panels you
    // want hidden while Market Intel is active.
    const PRODUCERS_ONLY_SELECTORS = [
      '#filter-panel',       // ← update to match your actual IDs / classes
      '#geology-legend',
      '#search-bar',
      // '#producer-controls',
    ];

    function getMap() {
      return window[MAP_GLOBAL_NAME];
    }

    function setProducersMode() {
      const leafletMap = getMap();
      if (!leafletMap) { console.warn('[ModeToggle] Map not found on window.' + MAP_GLOBAL_NAME); return; }

      // Deactivate intel mode
      if (DeliveryMode.isActive()) DeliveryMode.deactivate();

      // Button states
      btnProducers.classList.add('active');
      btnProducers.setAttribute('aria-pressed', 'true');
      btnIntel.classList.remove('active');
      btnIntel.setAttribute('aria-pressed', 'false');

      // Hide intel legend, show producers controls
      intelLegend.style.display = 'none';
      PRODUCERS_ONLY_SELECTORS.forEach(sel => {
        const el = document.querySelector(sel);
        if (el) el.style.display = '';
      });

      // Re-enable producers layers — your existing map.js layers
      // should still be on the map since DeliveryMode.deactivate()
      // only removes the intel layers.  If you manually removed them,
      // re-add them here.
    }

    function setIntelMode() {
      const leafletMap = getMap();
      if (!leafletMap) { console.warn('[ModeToggle] Map not found on window.' + MAP_GLOBAL_NAME); return; }

      // Hide producers-only UI
      PRODUCERS_ONLY_SELECTORS.forEach(sel => {
        const el = document.querySelector(sel);
        if (el) el.style.display = 'none';
      });

      // Button states
      btnIntel.classList.add('active');
      btnIntel.setAttribute('aria-pressed', 'true');
      btnProducers.classList.remove('active');
      btnProducers.setAttribute('aria-pressed', 'false');

      // Show intel legend
      intelLegend.style.display = 'block';

      // Activate intel mode (loads data if first time)
      DeliveryMode.activate(leafletMap);
    }

    btnProducers.addEventListener('click', () => {
      if (!btnProducers.classList.contains('active')) setProducersMode();
    });

    btnIntel.addEventListener('click', () => {
      if (!btnIntel.classList.contains('active')) setIntelMode();
    });

    // Keyboard support (left/right arrow between modes)
    document.getElementById('mode-toggle-bar').addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        if (btnProducers.classList.contains('active')) setIntelMode();
        else setProducersMode();
      }
    });

  })();
  </script>
