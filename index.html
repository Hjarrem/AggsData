<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Aggregate Producers Map</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- App styles -->
    <link rel="stylesheet" href="map.css" />
    <link rel="stylesheet" href="delivery-mode.css" />

    <!-- DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #map {
            width: 100vw;
            height: 100vh;
        }

        /* Mode toggle — floats centered at the top of the map */
        #mode-toggle-bar {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000; /* Z.modeToggle */
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Mode Toggle — centered at top of viewport -->
    <div class="mode-toggle-bar" id="mode-toggle-bar"
         role="group" aria-label="Map mode selector">

        <button class="mode-btn active" id="mode-btn-producers"
                aria-pressed="true" title="Aggregate Producer Locations">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 22 22 2 22"/>
            </svg>
            Producers
        </button>

        <div class="mode-divider" aria-hidden="true"></div>

        <button class="mode-btn intel-btn" id="mode-btn-intel"
                aria-pressed="false" title="Market Intel — Deliveries &amp; Pricing">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            Market Intel
        </button>

    </div>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Load order: config → map → delivery-mode → toggle controller -->
    <script src="config.js"></script>
    <script src="map.js"></script>
    <script src="delivery-mode.js"></script>

    <!-- ── Mode Toggle Controller ─────────────────────────────────────────────
         Pure glue — calls the public APIs on ProducersLayer and DeliveryMode.
         The intel legend is now owned by DeliveryMode (created on activate,
         removed on deactivate), so there is nothing legend-related to manage here.
    ──────────────────────────────────────────────────────────────────────── -->
    <script>
    (function initModeToggle() {

        const btnProducers = document.getElementById('mode-btn-producers');
        const btnIntel     = document.getElementById('mode-btn-intel');

        function activateProducers() {
            if (window.DeliveryMode?.isActive()) DeliveryMode.deactivate();
            if (window.ProducersLayer)           ProducersLayer.show();

            btnProducers.classList.add('active');
            btnProducers.setAttribute('aria-pressed', 'true');
            btnIntel.classList.remove('active');
            btnIntel.setAttribute('aria-pressed', 'false');
        }

        function activateIntel() {
            if (window.ProducersLayer) ProducersLayer.hide();
            if (window.DeliveryMode)   DeliveryMode.activate(map);

            btnIntel.classList.add('active');
            btnIntel.setAttribute('aria-pressed', 'true');
            btnProducers.classList.remove('active');
            btnProducers.setAttribute('aria-pressed', 'false');
        }

        btnProducers.addEventListener('click', () => {
            if (!btnProducers.classList.contains('active')) activateProducers();
        });

        btnIntel.addEventListener('click', () => {
            if (!btnIntel.classList.contains('active')) activateIntel();
        });

        // Arrow-key toggle between modes
        document.getElementById('mode-toggle-bar').addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                e.preventDefault();
                if (btnProducers.classList.contains('active')) activateIntel();
                else activateProducers();
            }
        });

        // Prevent toggle-bar clicks from reaching the map (would fire intel price estimator)
        document.getElementById('mode-toggle-bar').addEventListener('click', e => {
            e.stopPropagation();
        });

    })();
    </script>

</body>
</html>
